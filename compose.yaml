services:
  postgres_db:
    image: postgres:16-alpine
    container_name: mi_postgres_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rt1234567l
      POSTGRES_DB: recipecatalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mi_usuario -d mi_base_de_datos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - recetas-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recetas-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DATABASE_URL=postgresql://postgres:rt1234567l@postgres_db:5432/recipecatalog
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - recetas-network

  frontend:
    build:
      context: ./WebPage/recipe-catalog
      dockerfile: Dockerfile
    container_name: recetas-frontend
    ports:
      - "3000:80"
    networks:
      - recetas-network

  api-tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - .:/src
    working_dir: /src
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - DATABASE_URL=postgresql://postgres:rt1234567l@postgres_db:5432/recipecatalog
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - recetas-network
    command: dotnet test


volumes:
  postgres_data:

networks:
  recetas-network:
    driver: bridge
