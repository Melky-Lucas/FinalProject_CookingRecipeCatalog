services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recetas-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=JuanElLoco!123
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P JuanElLoco!123 -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - recetas-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recetas-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=RecetasDb;User Id=sa;Password=JuanElLoco!123;TrustServerCertificate=True; 
    depends_on:
      db:
        condition: service_healthy
    networks:
      - recetas-network

  frontend:
    build:
      context: ./WebPage/recipe-catalog
      dockerfile: Dockerfile
    container_name: recetas-frontend
    ports:
      - "3000:80"
    networks:
      - recetas-network

  api-tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - .:/src
    working_dir: /src
    environment:
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=RecetasDb;User Id=sa;Password=JuanElLoco!123;TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy
    networks:
      - recetas-network
    command: dotnet test


volumes:
  sqlserver-data:

networks:
  recetas-network:
    driver: bridge
